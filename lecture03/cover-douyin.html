<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Lecture 3 封面 · 抖音 9:16 (1080×1920)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0d0b;--fg:#ede9e0;--fg2:#a8a49b;--fg3:#6f6b63;
  --accent:#6dbf5e;--accent-deep:#3d8a35;--amber:#ddb84a;--blue:#5ba4e6;
  --coral:#e8734a;--purple:#b07ee8;
  --zh:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Heiti SC','Microsoft JhengHei',sans-serif;
  --en:Georgia,'Times New Roman','Nimbus Roman',serif;
}
html,body{background:#000}
body{display:flex;align-items:flex-start;justify-content:flex-start}

.cover{
  width:1080px;height:1920px;flex:none;position:relative;overflow:hidden;
  color:var(--fg);font-family:var(--zh);text-align:center;
  background:
    radial-gradient(900px 760px at 50% 22%,rgba(91,164,230,0.18),transparent 68%),
    radial-gradient(700px 500px at 20% 80%,rgba(232,115,74,0.08),transparent 60%),
    radial-gradient(600px 400px at 85% 70%,rgba(176,126,232,0.07),transparent 60%),
    linear-gradient(168deg,#10150f 0%,#0b0d0b 54%,#070907 100%);
}
.cover::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(820px 1180px at 50% 46%,#000,transparent 80%);
          mask-image:radial-gradient(820px 1180px at 50% 46%,#000,transparent 80%);
}
.ghost{
  position:absolute;left:50%;bottom:-218px;transform:translateX(-50%);
  font-family:var(--en);font-style:italic;font-weight:700;
  font-size:880px;line-height:1;letter-spacing:-30px;
  color:rgba(91,164,230,0.05);user-select:none;
}
.frame{position:absolute;inset:38px;border:1px solid rgba(255,255,255,0.07)}
.frame::before,.frame::after{
  content:'';position:absolute;width:38px;height:38px;border:2px solid var(--blue);
}
.frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

.eyebrow{
  position:absolute;left:0;right:0;top:128px;
  display:flex;align-items:center;justify-content:center;gap:18px;
  font-size:24px;letter-spacing:5px;color:var(--fg2);font-weight:500;
}
.eyebrow .dot{width:9px;height:9px;background:var(--blue);transform:rotate(45deg);
  box-shadow:0 0 14px rgba(91,164,230,0.7)}

/* potential well visual */
.well-container{
  position:absolute;left:50%;top:260px;width:500px;height:420px;margin-left:-250px;
}
.well-svg{width:100%;height:100%}

/* tag */
.tag{position:absolute;left:0;right:0;top:760px}
.tag span{
  display:inline-flex;align-items:center;gap:13px;
  border:1.5px solid rgba(91,164,230,0.42);border-radius:5px;
  padding:11px 24px;font-size:25px;letter-spacing:3px;color:var(--blue);
  font-family:var(--en);font-weight:600;
}
.tag b{font-family:var(--zh);font-weight:700;letter-spacing:3px}

/* hero */
.hero{position:absolute;left:0;right:0;top:860px}
.h1{font-weight:800;font-size:138px;line-height:1.12;letter-spacing:6px}
.h1 .g{color:var(--blue);text-shadow:0 0 70px rgba(91,164,230,0.4)}
.h1 .a{color:var(--coral);text-shadow:0 0 50px rgba(232,115,74,0.35)}
.en{
  font-family:var(--en);font-size:28px;letter-spacing:5px;color:var(--fg3);
  margin-top:26px;text-transform:uppercase;font-weight:600;
}

/* molecule colors */
.mol-row{
  position:absolute;left:0;right:0;top:1280px;
  display:flex;align-items:center;justify-content:center;gap:22px;
}
.mol-chip{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 20px;border-radius:8px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
}
.mol-chip .swatch{width:42px;height:42px;border-radius:6px}
.mol-chip .name{font-size:20px;color:var(--fg2);letter-spacing:1px}
.mol-chip .wl{font-family:var(--en);font-size:18px;color:var(--fg3)}

/* punch */
.punch{
  position:absolute;left:0;right:0;top:1456px;
  font-size:50px;font-weight:700;line-height:1.38;letter-spacing:2px;
}
.punch em{color:var(--amber);font-style:normal}

/* equation */
.eq{
  position:absolute;left:0;right:0;top:1650px;
  display:flex;align-items:center;justify-content:center;gap:28px;
  font-family:var(--en);font-style:italic;font-size:34px;color:var(--fg2);
}
.eq b{color:var(--blue);font-weight:600}
.eq .arr{color:var(--accent);font-style:normal;font-size:28px}

/* credit */
.credit{
  position:absolute;left:0;right:0;bottom:112px;
  font-size:23px;color:var(--fg3);letter-spacing:2px;
}
.credit b{color:var(--fg2);font-weight:700}
.credit .sep{color:var(--blue);margin:0 12px}
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="ghost">03</div>

  <div class="eyebrow"><span class="dot"></span>有机半导体中的量子力学应用<span class="dot"></span></div>

  <!-- Potential Well with Energy Levels & Wave Functions -->
  <div class="well-container">
    <svg class="well-svg" viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg">
      <!-- well walls -->
      <rect x="80" y="40" width="6" height="340" fill="rgba(91,164,230,0.6)" rx="3"/>
      <rect x="414" y="40" width="6" height="340" fill="rgba(91,164,230,0.6)" rx="3"/>
      <line x1="80" y1="380" x2="420" y2="380" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <!-- V=∞ labels -->
      <text x="58" y="30" fill="rgba(91,164,230,0.7)" font-family="Georgia" font-size="18" font-style="italic" text-anchor="middle">V=∞</text>
      <text x="442" y="30" fill="rgba(91,164,230,0.7)" font-family="Georgia" font-size="18" font-style="italic" text-anchor="middle">V=∞</text>

      <!-- energy levels -->
      <!-- n=1 -->
      <line x1="100" y1="340" x2="400" y2="340" stroke="rgba(232,115,74,0.5)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <!-- n=2 -->
      <line x1="100" y1="280" x2="400" y2="280" stroke="rgba(221,184,74,0.5)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <!-- n=3 -->
      <line x1="100" y1="190" x2="400" y2="190" stroke="rgba(109,191,94,0.5)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <!-- n=4 -->
      <line x1="100" y1="70" x2="400" y2="70" stroke="rgba(176,126,232,0.5)" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- wave functions -->
      <!-- ψ₁: half sine, no node -->
      <path d="M100,340 C140,340 180,300 200,280 C230,250 250,240 250,240 C250,240 270,250 300,280 C320,300 360,340 400,340"
            fill="none" stroke="rgba(232,115,74,0.9)" stroke-width="2.8"/>
      <!-- ψ₂: full sine, 1 node -->
      <path d="M100,280 C130,280 160,250 190,230 C210,218 230,215 250,280 C270,345 290,342 310,330 C340,312 370,280 400,280"
            fill="none" stroke="rgba(221,184,74,0.9)" stroke-width="2.8"/>
      <!-- ψ₃: 1.5 sine, 2 nodes -->
      <path d="M100,190 C120,190 140,165 160,150 C175,140 185,140 200,190 C215,240 225,240 250,190 C275,140 285,140 300,190 C315,240 325,240 340,190 C355,165 380,190 400,190"
            fill="none" stroke="rgba(109,191,94,0.9)" stroke-width="2.8"/>

      <!-- level labels -->
      <text x="416" y="344" fill="rgba(232,115,74,0.85)" font-family="Georgia" font-size="22" font-style="italic">n=1</text>
      <text x="416" y="284" fill="rgba(221,184,74,0.85)" font-family="Georgia" font-size="22" font-style="italic">n=2</text>
      <text x="416" y="194" fill="rgba(109,191,94,0.85)" font-family="Georgia" font-size="22" font-style="italic">n=3</text>
      <text x="416" y="74" fill="rgba(176,126,232,0.85)" font-family="Georgia" font-size="22" font-style="italic">n=4</text>

      <!-- HOMO-LUMO arrow -->
      <defs>
        <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
          <path d="M0,8 L4,0 L8,8" fill="none" stroke="var(--amber)" stroke-width="1.8"/>
        </marker>
      </defs>
      <line x1="250" y1="335" x2="250" y2="75" stroke="var(--amber)" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrowUp)" opacity="0.7"/>
      <text x="250" y="210" fill="var(--amber)" font-family="Georgia" font-size="17" text-anchor="middle" opacity="0.85">ΔE ∝ 1/L²</text>

      <!-- L label -->
      <line x1="100" y1="400" x2="400" y2="400" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <line x1="100" y1="394" x2="100" y2="406" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <line x1="400" y1="394" x2="400" y2="406" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <text x="250" y="417" fill="var(--fg2)" font-family="Georgia" font-size="20" font-style="italic" text-anchor="middle">L = conjugation length</text>
    </svg>
  </div>

  <div class="tag"><span><b>第 03 讲</b> · LECTURE 03</span></div>

  <div class="hero">
    <div class="h1">无限深<span class="g">势阱</span><br>与<span class="a">共轭</span>长度</div>
    <div class="en">Particle in a Box &amp; Conjugation Length</div>
  </div>

  <!-- molecule color swatches -->
  <div class="mol-row">
    <div class="mol-chip">
      <div class="swatch" style="background:transparent;border:1.5px solid rgba(255,255,255,0.25)"></div>
      <div class="name">萘</div>
      <div class="wl">220 nm</div>
    </div>
    <div class="mol-chip">
      <div class="swatch" style="background:rgba(200,180,255,0.25);border:1.5px solid rgba(200,180,255,0.4)"></div>
      <div class="name">蒽</div>
      <div class="wl">380 nm</div>
    </div>
    <div class="mol-chip">
      <div class="swatch" style="background:rgba(255,160,60,0.55)"></div>
      <div class="name">并四苯</div>
      <div class="wl">480 nm</div>
    </div>
    <div class="mol-chip">
      <div class="swatch" style="background:rgba(100,60,180,0.7)"></div>
      <div class="name">并五苯</div>
      <div class="wl">580 nm</div>
    </div>
  </div>

  <div class="punch">共轭链越长<br>光的颜色就越<em>红</em></div>

  <!-- equation -->
  <div class="eq">
    <span><b>E</b><sub>n</sub> = n²π²ℏ² / 2m<b>L</b>²</span>
    <span class="arr">→</span>
    <span>λ<sub>abs</sub> ∝ <b>L</b>²</span>
  </div>

  <div class="credit"><b>Zesheng Liu</b><span class="sep">·</span>Linköping University<span class="sep">·</span>系列 03 / 12</div>
</div>
</body>
</html>
