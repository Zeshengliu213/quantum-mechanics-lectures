<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Lecture 3 封面 · Bilibili 4:3 (1600×1200)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0d0b;--fg:#ede9e0;--fg2:#a8a49b;--fg3:#6f6b63;
  --accent:#6dbf5e;--accent-deep:#3d8a35;--amber:#ddb84a;--blue:#5ba4e6;
  --coral:#e8734a;--purple:#b07ee8;
  --zh:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Heiti SC','Microsoft JhengHei',sans-serif;
  --en:Georgia,'Times New Roman','Nimbus Roman',serif;
}
html,body{background:#000}
body{display:flex;align-items:flex-start;justify-content:flex-start}

.cover{
  width:1600px;height:1200px;flex:none;position:relative;overflow:hidden;
  color:var(--fg);font-family:var(--zh);
  background:
    radial-gradient(1100px 700px at 72% 28%,rgba(91,164,230,0.18),transparent 68%),
    radial-gradient(800px 500px at 10% 90%,rgba(232,115,74,0.08),transparent 60%),
    radial-gradient(600px 400px at 85% 75%,rgba(176,126,232,0.07),transparent 60%),
    linear-gradient(158deg,#10150f 0%,#0b0d0b 56%,#070907 100%);
}
.cover::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(1200px 900px at 55% 44%,#000,transparent 78%);
          mask-image:radial-gradient(1200px 900px at 55% 44%,#000,transparent 78%);
}
.ghost{
  position:absolute;right:-50px;bottom:-280px;
  font-family:var(--en);font-style:italic;font-weight:700;
  font-size:880px;line-height:1;letter-spacing:-26px;
  color:rgba(91,164,230,0.05);user-select:none;
}
.frame{position:absolute;inset:36px;border:1px solid rgba(255,255,255,0.07)}
.frame::before,.frame::after{
  content:'';position:absolute;width:32px;height:32px;border:2px solid var(--blue);
}
.frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

/* top bar */
.eyebrow{
  position:absolute;left:100px;top:82px;display:flex;align-items:center;gap:13px;
  font-size:21px;letter-spacing:5px;color:var(--fg2);font-weight:500;
}
.eyebrow .dot{width:9px;height:9px;background:var(--blue);transform:rotate(45deg);
  box-shadow:0 0 14px rgba(91,164,230,0.7)}
.series{
  position:absolute;right:100px;top:76px;text-align:right;font-family:var(--en);
}
.series .lab{font-size:15px;letter-spacing:4px;color:var(--fg3);text-transform:uppercase}
.series .num{font-size:38px;color:var(--fg2);font-weight:600;margin-top:2px}
.series .num b{color:var(--blue);font-weight:700}

/* hero — left column */
.hero{position:absolute;left:100px;top:240px;max-width:780px}
.tag{
  display:inline-flex;align-items:center;gap:12px;
  border:1.5px solid rgba(91,164,230,0.42);border-radius:4px;
  padding:9px 18px;font-size:22px;letter-spacing:3px;color:var(--blue);
  font-family:var(--en);font-weight:600;
}
.tag .zh{font-family:var(--zh);font-weight:700;letter-spacing:2px}
.h1{font-weight:800;font-size:146px;line-height:1.08;letter-spacing:5px;margin-top:28px}
.h1 .g{color:var(--blue);text-shadow:0 0 64px rgba(91,164,230,0.4)}
.h1 .a{color:var(--coral);text-shadow:0 0 50px rgba(232,115,74,0.35)}
.en{
  font-family:var(--en);font-size:28px;letter-spacing:6px;color:var(--fg3);
  margin-top:18px;text-transform:uppercase;font-weight:600;
}

/* potential well — right column */
.well-container{
  position:absolute;right:80px;top:180px;width:540px;height:460px;
}
.well-svg{width:100%;height:100%}

/* tagline */
.tagline{position:absolute;left:104px;top:800px;padding-left:24px}
.tagline::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;width:4px;
  background:linear-gradient(var(--blue),rgba(91,164,230,0.3));border-radius:2px;
}
.tl-big{font-size:38px;font-weight:700;color:var(--fg);letter-spacing:1px}
.tl-big em{color:var(--amber);font-style:normal}

/* molecule color chips */
.mol-row{
  position:absolute;left:104px;bottom:178px;
  display:flex;align-items:center;gap:18px;
}
.mol-chip{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 18px;border-radius:7px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
}
.mol-chip .swatch{width:36px;height:36px;border-radius:5px}
.mol-chip .name{font-size:18px;color:var(--fg2);letter-spacing:1px}
.mol-chip .wl{font-family:var(--en);font-size:16px;color:var(--fg3)}

/* equations */
.eq{
  position:absolute;left:100px;bottom:92px;display:flex;align-items:center;gap:26px;
  font-family:var(--en);font-style:italic;font-size:28px;color:var(--fg2);
}
.eq .s{color:rgba(91,164,230,0.45);font-style:normal;font-size:20px}
.eq b{color:var(--blue);font-weight:600}

/* credit */
.credit{
  position:absolute;right:100px;bottom:92px;text-align:right;
  font-size:20px;color:var(--fg3);letter-spacing:1px;
}
.credit b{color:var(--fg2);font-weight:700}
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="ghost">03</div>

  <div class="eyebrow"><span class="dot"></span>有机半导体中的量子力学应用</div>
  <div class="series">
    <div class="lab">Course Series</div>
    <div class="num"><b>03</b> / 12</div>
  </div>

  <!-- Potential Well SVG — right side -->
  <div class="well-container">
    <svg class="well-svg" viewBox="0 0 540 460" xmlns="http://www.w3.org/2000/svg">
      <!-- well walls -->
      <rect x="80" y="40" width="6" height="370" fill="rgba(91,164,230,0.55)" rx="3"/>
      <rect x="454" y="40" width="6" height="370" fill="rgba(91,164,230,0.55)" rx="3"/>
      <line x1="80" y1="410" x2="460" y2="410" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <!-- V=∞ -->
      <text x="56" y="30" fill="rgba(91,164,230,0.7)" font-family="Georgia" font-size="18" font-style="italic" text-anchor="middle">V=∞</text>
      <text x="484" y="30" fill="rgba(91,164,230,0.7)" font-family="Georgia" font-size="18" font-style="italic" text-anchor="middle">V=∞</text>

      <!-- energy levels -->
      <line x1="100" y1="370" x2="440" y2="370" stroke="rgba(232,115,74,0.45)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <line x1="100" y1="300" x2="440" y2="300" stroke="rgba(221,184,74,0.45)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <line x1="100" y1="200" x2="440" y2="200" stroke="rgba(109,191,94,0.45)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <line x1="100" y1="70" x2="440" y2="70" stroke="rgba(176,126,232,0.45)" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- wave functions -->
      <!-- ψ₁ -->
      <path d="M100,370 C145,370 190,328 220,304 C250,278 265,268 270,268 C275,268 290,278 320,304 C350,328 395,370 440,370"
            fill="none" stroke="rgba(232,115,74,0.9)" stroke-width="2.6"/>
      <!-- ψ₂ -->
      <path d="M100,300 C130,300 165,268 195,248 C218,234 238,230 270,300 C302,370 322,366 340,352 C368,332 410,300 440,300"
            fill="none" stroke="rgba(221,184,74,0.9)" stroke-width="2.6"/>
      <!-- ψ₃ -->
      <path d="M100,200 C122,200 145,172 167,158 C182,148 192,148 213,200 C234,252 244,252 270,200 C296,148 306,148 327,200 C348,252 358,252 373,200 C388,172 418,200 440,200"
            fill="none" stroke="rgba(109,191,94,0.9)" stroke-width="2.6"/>

      <!-- level labels -->
      <text x="456" y="374" fill="rgba(232,115,74,0.85)" font-family="Georgia" font-size="21" font-style="italic">n=1</text>
      <text x="456" y="304" fill="rgba(221,184,74,0.85)" font-family="Georgia" font-size="21" font-style="italic">n=2</text>
      <text x="456" y="204" fill="rgba(109,191,94,0.85)" font-family="Georgia" font-size="21" font-style="italic">n=3</text>
      <text x="456" y="74" fill="rgba(176,126,232,0.85)" font-family="Georgia" font-size="21" font-style="italic">n=4</text>

      <!-- HOMO→LUMO arrow -->
      <defs>
        <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
          <path d="M0,8 L4,0 L8,8" fill="none" stroke="var(--amber)" stroke-width="1.8"/>
        </marker>
      </defs>
      <line x1="270" y1="365" x2="270" y2="76" stroke="var(--amber)" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrowUp)" opacity="0.65"/>
      <text x="270" y="225" fill="var(--amber)" font-family="Georgia" font-size="16" text-anchor="middle" opacity="0.8">ΔE ∝ 1/L²</text>

      <!-- L dimension -->
      <line x1="100" y1="436" x2="440" y2="436" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <line x1="100" y1="430" x2="100" y2="442" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <line x1="440" y1="430" x2="440" y2="442" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <text x="270" y="455" fill="var(--fg2)" font-family="Georgia" font-size="18" font-style="italic" text-anchor="middle">L = conjugation length</text>
    </svg>
  </div>

  <!-- Hero — left side -->
  <div class="hero">
    <span class="tag"><span class="zh">第 03 讲</span> · LECTURE 03</span>
    <div class="h1">无限深<span class="g">势阱</span><br>与<span class="a">共轭</span>长度</div>
    <div class="en">Particle in a Box &amp; Conjugation Length</div>
  </div>

  <div class="tagline">
    <div class="tl-big">共轭链越长，光的颜色就越<em>红</em></div>
  </div>

  <!-- molecule swatches -->
  <div class="mol-row">
    <div class="mol-chip">
      <div class="swatch" style="background:transparent;border:1.5px solid rgba(255,255,255,0.25)"></div>
      <div class="name">萘</div>
      <div class="wl">220 nm</div>
    </div>
    <div class="mol-chip">
      <div class="swatch" style="background:rgba(200,180,255,0.25);border:1.5px solid rgba(200,180,255,0.4)"></div>
      <div class="name">蒽</div>
      <div class="wl">380 nm</div>
    </div>
    <div class="mol-chip">
      <div class="swatch" style="background:rgba(255,160,60,0.55)"></div>
      <div class="name">并四苯</div>
      <div class="wl">480 nm</div>
    </div>
    <div class="mol-chip">
      <div class="swatch" style="background:rgba(100,60,180,0.7)"></div>
      <div class="name">并五苯</div>
      <div class="wl">580 nm</div>
    </div>
  </div>

  <!-- equations -->
  <div class="eq">
    <span><b>E</b><sub>n</sub> = n²π²ℏ² / 2m<b>L</b>²</span>
    <span class="s">◆</span>
    <span>λ<sub>abs</sub> ∝ <b>L</b>²</span>
  </div>

  <div class="credit"><b>Zesheng Liu</b><br>Linköping University</div>
</div>
</body>
</html>
